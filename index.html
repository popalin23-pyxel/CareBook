<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Medicinali Pazienti</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3d9e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root {
  --p: #3d9e8c;
  --pd: #2d7a6c;
  --pl: #e8f5f2;
  --w: #e09038;
  --wl: #fff8ee;
  --r: #e53935;
  --bg: #f0f2f0;
  --sur: #fff;
  --t1: #1a1a1a;
  --t2: #6b7280;
  --t3: #9ca3af;
  --br: #e5e7eb;
  --rad: 14px;
  --sh: 0 1px 4px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;max-width:600px;margin:0 auto}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}

/* Pages */
.page{display:none;min-height:100vh;flex-direction:column}
.page.active{display:flex}

/* Top bar */
.bar{background:var(--sur);padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--br);position:sticky;top:0;z-index:10}
.bar-back{background:none;border:none;color:var(--t1);font-size:20px;padding:4px 6px 4px 0;line-height:1}
.bar-title{flex:1;font-size:18px;font-weight:700}
.bar-icons{display:flex;gap:6px}
.ib{background:none;border:none;color:var(--t2);padding:7px;border-radius:9px;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.ib:hover{background:var(--bg)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Scrollable content */
.scroll{flex:1;overflow-y:auto;padding:14px 14px 100px}

/* Search */
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.search-inp{width:100%;padding:11px 14px 11px 38px;border:1.5px solid var(--br);border-radius:50px;font-size:14px;background:var(--sur);color:var(--t1);outline:none}
.search-inp:focus{border-color:var(--p)}

/* Pill buttons row */
.pills{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pill{background:var(--sur);border:1.5px solid var(--br);border-radius:50px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--t2);white-space:nowrap}
.pill.active,.pill:hover{background:var(--p);border-color:var(--p);color:#fff}
.pill-label{font-size:12px;color:var(--t2);margin-right:4px}

/* Operator selector */
.op-selector{display:inline-flex;align-items:center;gap:8px;background:var(--sur);border:1.5px solid var(--br);border-radius:50px;padding:7px 14px 7px 10px;font-size:14px;font-weight:500;margin-bottom:14px}
.op-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.op-arrow{font-size:10px;color:var(--t2)}

/* Alert banner */
.alert-banner{background:var(--wl);border:1.5px solid #f0c07a;border-radius:var(--rad);padding:12px 14px;margin-bottom:12px}
.alert-banner-hd{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--w);margin-bottom:8px}
.alert-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #f0c07a30}
.alert-item-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--w);flex-shrink:0}
.alert-item-info{flex:1}
.alert-item-name{font-size:14px;font-weight:500}
.alert-item-sub{font-size:12px;color:var(--t2)}
.alert-item-days{font-size:13px;font-weight:600;color:var(--w)}

/* Patient cards */
.patient-card{background:var(--sur);border-radius:var(--rad);padding:14px;box-shadow:var(--sh);margin-bottom:10px;display:flex;align-items:center;gap:12px;border:1.5px solid transparent}
.patient-card.has-alert{border-color:var(--w)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--pl);color:var(--p);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.patient-info{flex:1;min-width:0}
.patient-name-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.patient-name{font-size:16px;font-weight:600}
.badge{background:var(--pl);color:var(--p);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.warn-icon{font-size:14px;color:var(--w)}
.patient-sub{font-size:13px;color:var(--t2)}
.chevron{color:var(--t3);font-size:16px}

/* Section header */
.sec-hd{font-size:13px;font-weight:600;color:var(--t2);letter-spacing:.5px;text-transform:uppercase;margin:18px 0 8px}

/* FAB */
.fab{position:fixed;bottom:22px;right:16px;background:var(--p);color:#fff;border:none;border-radius:50px;padding:13px 20px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;box-shadow:0 4px 16px rgba(61,158,140,.45);z-index:20}
.fab:hover{background:var(--pd)}

/* Detail page */
.det-header{background:var(--sur);border-radius:var(--rad);padding:16px;box-shadow:var(--sh);margin-bottom:12px;display:flex;align-items:center;gap:14px}
.det-avatar{width:52px;height:52px;border-radius:50%;background:var(--pl);color:var(--p);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
.det-name{font-size:18px;font-weight:700}
.det-room{font-size:13px;color:var(--t2);display:flex;align-items:center;gap:4px;margin-top:2px}

.allergy-box{background:var(--wl);border:1.5px solid #f0c07a;border-radius:var(--rad);padding:11px 14px;margin-bottom:12px;font-size:14px;color:var(--t1)}
.allergy-box strong{color:var(--w)}

.contact-card{background:var(--sur);border-radius:var(--rad);padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.contact-role{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.5px;float:right;margin-top:2px}
.contact-name{font-size:15px;font-weight:600;margin-bottom:8px}
.contact-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t2);margin-bottom:5px}
.contact-row a{color:var(--p)}

.section-box{background:var(--sur);border-radius:var(--rad);padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.section-box-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-box-title{font-size:16px;font-weight:700}
.add-link{color:var(--p);font-size:14px;font-weight:600;background:none;border:none}
.sub-label{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.5px;margin-bottom:8px;margin-top:8px}

.visit-item{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-top:1px solid var(--br)}
.visit-date-box{background:var(--bg);border-radius:8px;padding:6px 10px;text-align:center;flex-shrink:0;min-width:48px}
.visit-day{font-size:18px;font-weight:700;line-height:1}
.visit-month{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase}
.visit-info{flex:1}
.visit-title{font-size:14px;font-weight:600}
.visit-sub{font-size:12px;color:var(--t2);margin-top:2px}
.visit-notes{font-size:12px;color:var(--t2);font-style:italic;margin-top:2px}

.med-item{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--br)}
.med-icon{width:36px;height:36px;border-radius:50%;border:2px solid var(--br);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t2);flex-shrink:0}
.med-icon.low{border-color:var(--w);color:var(--w)}
.med-info{flex:1}
.med-name{font-size:14px;font-weight:600}
.med-sub{font-size:12px;color:var(--t2);margin-top:2px}
.med-status{font-size:12px;font-weight:600;color:var(--w)}
.med-status.ok{color:var(--p)}
.med-status.expired{color:var(--r)}

/* Add-to-patient button */
.add-med-btn{width:100%;margin-top:10px;padding:10px;border:1.5px dashed var(--br);border-radius:10px;background:none;color:var(--p);font-size:14px;font-weight:600}

/* Forms */
.form-group{margin-bottom:16px}
.form-label{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:6px;display:block}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--br);border-radius:10px;font-size:15px;color:var(--t1);background:var(--sur);outline:none}
.form-input:focus{border-color:var(--p)}
.form-input::placeholder{color:var(--t3)}
textarea.form-input{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-section{font-size:12px;font-weight:700;color:var(--t2);letter-spacing:.6px;text-transform:uppercase;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--br)}

/* Format selector */
.fmt-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.fmt-btn{border:1.5px solid var(--br);border-radius:50px;padding:7px 14px;font-size:13px;background:var(--sur);color:var(--t2);display:flex;align-items:center;gap:5px}
.fmt-btn.active,.fmt-btn:hover{border-color:var(--p);background:var(--pl);color:var(--p)}

/* Day checkboxes */
.days-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.day-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--br);background:var(--sur);font-size:12px;font-weight:600;color:var(--t2)}
.day-btn.active{border-color:var(--p);background:var(--p);color:#fff}

/* Dose inputs */
.dose-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.dose-cell label{font-size:11px;color:var(--t2);display:block;margin-bottom:4px;text-align:center}
.dose-cell input{width:100%;text-align:center;padding:9px 4px;border:1.5px solid var(--br);border-radius:9px;font-size:15px;font-weight:600}
.dose-cell input:focus{border-color:var(--p);outline:none}

/* Primary button */
.btn-primary{width:100%;padding:14px;background:var(--p);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;margin-top:8px}
.btn-primary:hover{background:var(--pd)}
.btn-secondary{width:100%;padding:13px;background:var(--sur);color:var(--t1);border:1.5px solid var(--br);border-radius:12px;font-size:15px;font-weight:600;margin-top:8px}
.btn-danger{width:100%;padding:13px;background:#fff5f5;color:var(--r);border:1.5px solid var(--r);border-radius:12px;font-size:15px;font-weight:600;margin-top:8px}

/* Calendar */
.cal-toggle{display:flex;background:var(--bg);border-radius:50px;padding:4px;margin:0 auto 16px;width:fit-content}
.cal-tab{padding:8px 22px;border-radius:50px;font-size:14px;font-weight:600;border:none;background:transparent;color:var(--t2)}
.cal-tab.active{background:var(--p);color:#fff}
.cal-box{background:var(--sur);border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.cal-nav-btn{background:none;border:none;font-size:18px;color:var(--p);padding:4px 10px}
.cal-month{font-size:16px;font-weight:700;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--t2);padding:6px 0}
.cal-day{text-align:center;padding:4px 2px;position:relative;cursor:pointer;min-height:52px;display:flex;flex-direction:column;align-items:center}
.cal-day-num{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;margin:0 auto}
.cal-day.today .cal-day-num{background:var(--p);color:#fff;font-weight:700}
.cal-day.selected .cal-day-num{background:var(--pl);color:var(--p);font-weight:700;border:2px solid var(--p)}
.cal-day.other-month .cal-day-num{color:var(--t3)}
.cal-day.sat .cal-day-num,.cal-day.sun .cal-day-num{color:var(--w)}
.cal-dots{display:flex;gap:3px;justify-content:center;margin-top:2px;flex-wrap:wrap}
.cal-dot{width:5px;height:5px;border-radius:50%}
.cal-legend{display:flex;gap:16px;font-size:12px;color:var(--t2);padding:8px 16px 12px;align-items:center}
.cal-legend-dot{width:8px;height:8px;border-radius:50%}
.cal-today-btn{background:var(--pl);border:none;border-radius:50px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--p)}

.cal-event{background:var(--sur);border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);display:flex;align-items:center;gap:12px}
.cal-event-icon{width:38px;height:38px;border-radius:50%;border:2px solid var(--br);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.cal-event-info{flex:1}
.cal-event-name{font-size:14px;font-weight:600}
.cal-event-sub{font-size:12px;color:var(--t2);margin-top:2px}

/* DB list */
.db-item{background:var(--sur);border-radius:var(--rad);padding:13px 14px;box-shadow:var(--sh);margin-bottom:8px;display:flex;align-items:center;gap:12px}
.db-item-icon{width:36px;height:36px;border-radius:50%;border:2px solid var(--br);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t2);flex-shrink:0}
.db-item-info{flex:1}
.db-item-name{font-size:15px;font-weight:600}
.db-item-sub{font-size:12px;color:var(--t2)}
.edit-btn{background:none;border:none;color:var(--t3);font-size:18px;padding:6px}

/* Settings */
.settings-sec{background:var(--sur);border-radius:var(--rad);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.settings-sec-title{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.6px;text-transform:uppercase;padding:14px 16px 6px}
.settings-sec-desc{font-size:12px;color:var(--t3);padding:0 16px 10px}
.settings-row{padding:12px 16px;border-top:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;gap:10px}
.settings-row-label{font-size:14px;display:flex;align-items:center;gap:8px}
.settings-row-val{font-size:14px;color:var(--t2)}

/* Language toggle */
.lang-toggle{display:flex;background:var(--bg);border-radius:50px;padding:3px;margin:10px 16px}
.lang-btn{flex:1;padding:7px;border-radius:50px;font-size:14px;font-weight:600;border:none;background:transparent;color:var(--t2)}
.lang-btn.active{background:var(--p);color:#fff}

/* Operator list */
.op-item{padding:12px 16px;border-top:1px solid var(--br);display:flex;align-items:center;gap:12px}
.op-item-dot{width:12px;height:12px;border-radius:50%}
.op-item-name{flex:1;font-size:15px;font-weight:500}
.op-active-badge{background:var(--pl);color:var(--p);border-radius:50px;padding:3px 10px;font-size:12px;font-weight:600}
.op-set-btn{background:none;border:none;color:var(--p);font-size:13px;font-weight:600}

.add-op-form{padding:14px 16px;border-top:1px solid var(--br)}
.add-op-title{font-size:14px;font-weight:600;margin-bottom:10px}
.color-row{display:flex;gap:8px;margin:10px 0}
.color-swatch{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.color-swatch.active{border-color:var(--t1)}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--br);margin-top:10px;border-radius:0 0 var(--rad) var(--rad);overflow:hidden}
.stat-cell{background:var(--sur);padding:14px 8px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--p)}
.stat-label{font-size:11px;color:var(--t2);margin-top:2px}

/* Alert count badge */
.cnt-badge{background:var(--w);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* No data */
.empty{text-align:center;padding:40px 20px;color:var(--t3);font-size:14px}

/* Autocomplete dropdown */
.autocomplete{position:relative}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--sur);border:1.5px solid var(--br);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:100;max-height:200px;overflow-y:auto;margin-top:4px}
.autocomplete-item{padding:11px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--br)}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:hover{background:var(--pl)}

/* PIN screen */
.pin-overlay{position:fixed;inset:0;background:var(--p);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.pin-dots{display:flex;gap:18px;margin:32px 0 10px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.5);transition:background .15s}
.pin-dot.filled{background:#fff;border-color:#fff}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:252px;margin-top:24px}
.pin-key{background:rgba(255,255,255,.15);border:none;border-radius:50%;width:78px;height:78px;font-size:26px;font-weight:600;color:#fff;cursor:pointer}
.pin-key:active{background:rgba(255,255,255,.3)}
.pin-key.del{font-size:22px}

/* Time chips */
.time-chip-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.time-chip{border:1.5px solid var(--br);border-radius:50px;padding:7px 11px;font-size:13px;font-weight:600;background:var(--sur);color:var(--t2);font-variant-numeric:tabular-nums}
.time-chip.active{border-color:var(--p);background:var(--p);color:#fff}

/* Schedule rows */
.schedule-list{margin-top:4px}
.schedule-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--br)}
.schedule-time{font-size:15px;font-weight:700;min-width:52px;font-variant-numeric:tabular-nums}
.qty-ctrl{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:50px;padding:5px 12px}
.qty-ctrl button{background:none;border:none;font-size:20px;color:var(--p);font-weight:700;padding:0;line-height:1;cursor:pointer}
.qty-ctrl span{font-size:15px;font-weight:700;min-width:28px;text-align:center}
.schedule-unit{font-size:13px;color:var(--t2);flex:1}
.schedule-del{background:none;border:none;color:var(--t3);font-size:20px;line-height:1;padding:0 4px;cursor:pointer}

/* Print styles */
@media print{
  body{max-width:none}
  .no-print{display:none!important}
}
</style>
</head>
<body>

<!-- ============ PAGE: PATIENTS ============ -->
<div id="page-patients" class="page active">
  <div class="bar" id="bar-patients"></div>
  <div class="scroll" id="content-patients"></div>
  <button class="fab" onclick="navigate('add-patient')">+ Nuovo paziente</button>
</div>

<!-- ============ PAGE: PATIENT DETAIL ============ -->
<div id="page-patient-detail" class="page">
  <div class="bar" id="bar-patient-detail"></div>
  <div class="scroll" id="content-patient-detail"></div>
</div>

<!-- ============ PAGE: ADD/EDIT PATIENT ============ -->
<div id="page-add-patient" class="page">
  <div class="bar" id="bar-add-patient"></div>
  <div class="scroll" id="content-add-patient"></div>
</div>

<!-- ============ PAGE: ADD MEDICINE TO PATIENT ============ -->
<div id="page-add-med" class="page">
  <div class="bar" id="bar-add-med"></div>
  <div class="scroll" id="content-add-med"></div>
</div>

<!-- ============ PAGE: ADD VISIT ============ -->
<div id="page-add-visit" class="page">
  <div class="bar" id="bar-add-visit"></div>
  <div class="scroll" id="content-add-visit"></div>
</div>

<!-- ============ PAGE: CALENDAR ============ -->
<div id="page-calendar" class="page">
  <div class="bar" id="bar-calendar"></div>
  <div class="scroll" id="content-calendar"></div>
</div>

<!-- ============ PAGE: DATABASE ============ -->
<div id="page-db" class="page">
  <div class="bar" id="bar-db"></div>
  <div class="scroll" id="content-db"></div>
  <button class="fab" onclick="navigate('add-db-med')">+ Aggiungi</button>
</div>

<!-- ============ PAGE: ADD DB MED ============ -->
<div id="page-add-db-med" class="page">
  <div class="bar" id="bar-add-db-med"></div>
  <div class="scroll" id="content-add-db-med"></div>
</div>

<!-- ============ PAGE: SETTINGS ============ -->
<div id="page-settings" class="page">
  <div class="bar" id="bar-settings"></div>
  <div class="scroll" id="content-settings"></div>
</div>

<!-- ============ PAGE: WAITING ============ -->
<div id="page-waiting" class="page"></div>

<!-- ============ PAGE: SUPER ADMIN ============ -->
<div id="page-super-admin" class="page"></div>

<!-- ============ PAGE: SEARCH ============ -->
<div id="page-search" class="page"></div>

<!-- ============ PAGE: LOGIN ============ -->
<div id="page-login" class="page"></div>
